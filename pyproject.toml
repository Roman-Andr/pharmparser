[project]
name = "pharmparser"
version = "0.2.1"
description = "Desktop app that scrapes and compares drug prices across tabletka.by pharmacies and exports a formatted Excel workbook."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
dependencies = [
    "aiohttp>=3.14",
    "beautifulsoup4>=4.15",
    "fastapi>=0.116",
    "keyring>=25.6",
    # lxml 6.0.1 was the first release shipping cp314 wheels.
    "lxml>=6.1.1",
    "ms-ovba>=0.0.1",
    "openpyxl>=3.1.5",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "pywebview>=6.0",
    "uvicorn>=0.35",
    # Excel macro injection (.xlsm buttons) is Windows-only; the rest of the
    # package must stay installable and testable everywhere.
    "pywin32>=312; sys_platform == 'win32'",
]

[project.scripts]
pharmparser = "pharmparser.__main__:main"
pharmparser-cli = "pharmparser.cli:main"

[dependency-groups]
dev = [
    # The network is faked with a real localhost server (tests/endpoint.py) rather
    # than aioresponses, which patches aiohttp's internals and has no release
    # working with aiohttp 3.14.
    "mypy>=1.18",
    "httpx>=0.28",
    "oletools>=0.60.2",
    "pre-commit>=4.3",
    "pytest>=9.0",
    "pytest-asyncio>=1.2",
    "pytest-cov>=7.0",
    "ruff>=0.14",
]
build = [
    # 6.15 is the first release supporting Python 3.14; 6.14 declares
    # `requires-python <3.14` and its bootloader aborts with
    # "Failed to allocate PyConfig structure" on a 3.14 build.
    "pyinstaller>=6.15",
    "pyinstaller-hooks-contrib>=2025.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pharmparser"]

[tool.ruff]
line-length = 120
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "UP",        # pyupgrade
    "B",         # flake8-bugbear
    "C4",        # flake8-comprehensions
    "SIM",       # flake8-simplify
    "RUF",       # ruff-specific
]
ignore = [
    # The UI and the generated workbook are Russian-language; Cyrillic literals
    # are intentional throughout, so the ambiguous-character rules are pure noise.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.14"
files = ["src", "tests"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/pharmparser"]
branch = true
