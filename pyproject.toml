[project]
name = "pharmparser"
version = "0.1.0"
description = "Desktop app that scrapes and compares drug prices across tabletka.by pharmacies and exports a formatted Excel workbook."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "aiohttp>=3.12.14",
    "beautifulsoup4>=4.13.4",
    "ctkmessagebox>=2.7",
    "customtkinter>=5.2.2",
    "lxml>=6.0.0",
    "openpyxl>=3.1.5",
    "psutil>=7.0.0",
    # Excel macro injection (.xlsm buttons) is Windows-only; the rest of the
    # package must stay installable and testable everywhere.
    "pywin32>=311; sys_platform == 'win32'",
]

[project.scripts]
pharmparser = "pharmparser.__main__:main"

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]
build = [
    "pyinstaller>=6.14.2",
    "pyinstaller-hooks-contrib>=2025.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pharmparser"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "UP",        # pyupgrade
    "B",         # flake8-bugbear
    "C4",        # flake8-comprehensions
    "SIM",       # flake8-simplify
    "RUF",       # ruff-specific
]
ignore = [
    # The UI and the generated workbook are Russian-language; Cyrillic literals
    # are intentional throughout, so the ambiguous-character rules are pure noise.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# Legacy modules still to be rewritten in phases 1-5 of docs/REFACTOR_PLAN.md.
module = [
    "pharmparser.core.*",
    "pharmparser.excel.*",
    "pharmparser.ui.*",
    "pharmparser.utils.*",
]
check_untyped_defs = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.coverage.run]
source = ["src/pharmparser"]
branch = true
